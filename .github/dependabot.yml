version: 2

# Monthly, and grouped, so an idle month costs a few pull requests at most.
# Minor and patch updates merge themselves through the merge queue once the
# required checks pass; major ones — a provider's new major version usually
# changes its configuration syntax — arrive on their own and wait for review
# (workflows/dependabot-automerge.yml).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /terraform
      - /terraform-asg
      - /terraform-eks
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
