name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The node bootstrap is plain bash — not a .tftpl — precisely so it can be
  # linted here. It is the file where a quoting or expansion bug is most
  # expensive: it forms the etcd cluster.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck terraform/modules/etcfs-asg/scripts/*.sh

  fmt-validate:
    name: fmt & validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [terraform, terraform-asg, terraform-eks]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform -chdir=${{ matrix.dir }} fmt -check -recursive
      - name: init
        run: terraform -chdir=${{ matrix.dir }} init -backend=false
      - name: validate
        run: terraform -chdir=${{ matrix.dir }} validate
